
name: Build KoaZa WPF app

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build KoaZa
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Check project files
        shell: pwsh
        run: |
          $required = @(
            "src/KoaZa/KoaZa.sln",
            "src/KoaZa/KoaZa.csproj",
            "src/KoaZa/packages.config"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required project file is missing: $file"
            }
          }

      - name: Install SQLite packages
        shell: pwsh
        run: |
          $root = "src/KoaZa/packages"

          New-Item -ItemType Directory -Force -Path $root | Out-Null

          nuget install Stub.System.Data.SQLite.Core.NetFramework `
            -Version 1.0.119 `
            -OutputDirectory $root `
            -NonInteractive `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the SQLite .NET Framework package."
          }

          $dll = Get-ChildItem $root -Recurse `
            -Filter "System.Data.SQLite.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $dll) {
            Write-Host "Installed package contents:"
            Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "System.Data.SQLite.dll was not found in the installed package."
          }

          Write-Host "SQLite DLL found at: $($dll.FullName)"

          $expected = Join-Path $root `
            "System.Data.SQLite.Core.1.0.119.0/lib/net46/System.Data.SQLite.dll"

          New-Item -ItemType Directory -Force `
            -Path (Split-Path $expected) | Out-Null

          if ($dll.FullName -ne (Join-Path (Get-Location) $expected)) {
            Copy-Item $dll.FullName $expected -Force
          }

          Write-Host "SQLite reference prepared: $expected"

      - name: Restore solution packages
        shell: pwsh
        run: |
          nuget restore "src/KoaZa/KoaZa.sln" `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Solution package restore failed."
          }

      - name: Verify SQLite reference
        shell: pwsh
        run: |
          $dll = "src/KoaZa/packages/System.Data.SQLite.Core.1.0.119.0/lib/net46/System.Data.SQLite.dll"

          if (-not (Test-Path $dll)) {
            throw "The SQLite DLL required by KoaZa.csproj is missing: $dll"
          }

          Write-Host "SQLite reference verified."

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "src/KoaZa/KoaZa.sln" `
            /m `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed. Check the build output above."
          }

      - name: Prepare build artifact
        shell: pwsh
        run: |
          $source = "src/KoaZa/bin/Release"
          $target = "artifact/KoaZa"

          if (-not (Test-Path $source)) {
            throw "Release output directory was not created: $source"
          }

          $exe = Get-ChildItem $source -Filter "KoaZa.exe" `
            -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Get-ChildItem $source -Recurse |
              Select-Object -ExpandProperty FullName

            throw "KoaZa.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force

          if (Test-Path "README_FA.md") {
            Copy-Item "README_FA.md" $target -Force
          }

          Write-Host "Build files prepared:"
          Get-ChildItem $target -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Windows-Build
          path: artifact/KoaZa/
          if-no-files-found: error
          retention-days: 7
