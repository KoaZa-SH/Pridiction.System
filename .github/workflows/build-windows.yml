
name: Build KoaZa WPF app

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build KoaZa
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Check project files
        shell: pwsh
        run: |
          $required = @(
            "src/KoaZa/KoaZa.sln",
            "src/KoaZa/KoaZa.csproj",
            "src/KoaZa/packages.config"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file not found: $file"
            }
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget install "src/KoaZa/packages.config" `
            -OutputDirectory "src/KoaZa/packages" `
            -NonInteractive `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package installation failed."
          }

      - name: Verify SQLite DLL
        shell: pwsh
        run: |
          $packageRoot = "src/KoaZa/packages"
          $expected = Join-Path $packageRoot `
            "System.Data.SQLite.Core.1.0.119.0/lib/net46/System.Data.SQLite.dll"

          if (-not (Test-Path $expected)) {
            $found = Get-ChildItem $packageRoot `
              -Recurse -Filter "System.Data.SQLite.dll" `
              -ErrorAction SilentlyContinue

            if ($found) {
              Write-Host "SQLite DLL found at:"
              $found | ForEach-Object {
                Write-Host $_.FullName
              }

              $sourceDll = $found |
                Select-Object -First 1

              New-Item -ItemType Directory `
                -Force -Path (Split-Path $expected) | Out-Null

              Copy-Item $sourceDll.FullName $expected -Force
            }
          }

          if (-not (Test-Path $expected)) {
            Write-Host "Package contents:"
            Get-ChildItem $packageRoot -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "System.Data.SQLite.dll was not found."
          }

          Write-Host "SQLite DLL verified: $expected"

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "src/KoaZa/KoaZa.sln" `
            /m `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed."
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          $source = "src/KoaZa/bin/Release"
          $target = "artifact/KoaZa"

          if (-not (Test-Path "$source/KoaZa.exe")) {
            throw "KoaZa.exe was not produced."
          }

          New-Item -ItemType Directory `
            -Force -Path $target | Out-Null

          Copy-Item "$source/*" $target -Recurse -Force

          if (Test-Path "README_FA.md") {
            Copy-Item "README_FA.md" $target -Force
          }

          Get-ChildItem $target -Recurse

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Windows-Build
          path: artifact/KoaZa/
          if-no-files-found: error
          retention-days: 7
