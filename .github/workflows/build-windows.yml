
name: Build KoaZa WPF app

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KoaZa with SQLite
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Check project files
        shell: pwsh
        run: |
          $required = @(
            "src/KoaZa/KoaZa.sln",
            "src/KoaZa/KoaZa.csproj",
            "src/KoaZa/packages.config"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Install SQLite .NET Framework package
        shell: pwsh
        run: |
          $root = "src/KoaZa/packages"

          New-Item -ItemType Directory -Force -Path $root | Out-Null

          nuget install Stub.System.Data.SQLite.Core.NetFramework `
            -Version 1.0.119 `
            -OutputDirectory $root `
            -NonInteractive `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download SQLite package."
          }

          $package = Join-Path $root `
            "Stub.System.Data.SQLite.Core.NetFramework.1.0.119"

          if (-not (Test-Path $package)) {
            Get-ChildItem $root -Recurse |
              Select-Object -ExpandProperty FullName
            throw "SQLite package folder was not created."
          }

          $provider = Get-ChildItem $package -Recurse `
            -Filter "System.Data.SQLite.dll" |
            Select-Object -First 1

          if (-not $provider) {
            throw "System.Data.SQLite.dll was not found in the package."
          }

          $providerTarget = `
            "src/KoaZa/packages/System.Data.SQLite.Core.1.0.119.0/lib/net46"

          New-Item -ItemType Directory -Force `
            -Path $providerTarget | Out-Null

          Copy-Item $provider.FullName `
            "$providerTarget/System.Data.SQLite.dll" -Force

          Write-Host "SQLite managed provider installed."

      - name: Restore solution packages
        shell: pwsh
        run: |
          nuget restore "src/KoaZa/KoaZa.sln" -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet solution restore failed."
          }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "src/KoaZa/KoaZa.sln" `
            /m `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed."
          }

      - name: Package SQLite native DLLs
        shell: pwsh
        run: |
          $root = "src/KoaZa/packages"
          $output = "src/KoaZa/bin/Release"

          if (-not (Test-Path "$output/KoaZa.exe")) {
            throw "KoaZa.exe was not produced."
          }

          $nativeFiles = Get-ChildItem $root -Recurse `
            -Filter "SQLite.Interop.dll" `
            -ErrorAction SilentlyContinue

          if (-not $nativeFiles) {
            Get-ChildItem $root -Recurse |
              Select-Object -ExpandProperty FullName
            throw "SQLite.Interop.dll was not found in the installed packages."
          }

          $x86 = $nativeFiles |
            Where-Object { $_.FullName -match '[\\/]x86[\\/]' } |
            Select-Object -First 1

          $x64 = $nativeFiles |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1

          if (-not $x86) {
            throw "The x86 SQLite.Interop.dll was not found."
          }

          if (-not $x64) {
            throw "The x64 SQLite.Interop.dll was not found."
          }

          New-Item -ItemType Directory -Force `
            -Path "$output/x86" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "$output/x64" | Out-Null

          Copy-Item $x86.FullName `
            "$output/x86/SQLite.Interop.dll" -Force

          Copy-Item $x64.FullName `
            "$output/x64/SQLite.Interop.dll" -Force

          if (-not (Test-Path "$output/x86/SQLite.Interop.dll")) {
            throw "The x86 native SQLite DLL was not copied."
          }

          if (-not (Test-Path "$output/x64/SQLite.Interop.dll")) {
            throw "The x64 native SQLite DLL was not copied."
          }

          Write-Host "Both SQLite native DLLs were packaged."
          Get-ChildItem $output -Recurse -Filter "SQLite.Interop.dll" |
            Select-Object -ExpandProperty FullName

      - name: Prepare portable output
        shell: pwsh
        run: |
          $source = "src/KoaZa/bin/Release"
          $target = "artifact/KoaZa"

          New-Item -ItemType Directory -Force `
            -Path $target | Out-Null

          Copy-Item "$source/*" $target -Recurse -Force

          if (Test-Path "README_FA.md") {
            Copy-Item "README_FA.md" $target -Force
          }

          $requiredOutput = @(
            "$target/KoaZa.exe",
            "$target/System.Data.SQLite.dll",
            "$target/x86/SQLite.Interop.dll",
            "$target/x64/SQLite.Interop.dll"
          )

          foreach ($file in $requiredOutput) {
            if (-not (Test-Path $file)) {
              throw "Required output file missing: $file"
            }
          }

          Write-Host "Portable output prepared successfully."
          Get-ChildItem $target -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Windows-Build
          path: artifact/KoaZa/
          if-no-files-found: error
          retention-days: 7
