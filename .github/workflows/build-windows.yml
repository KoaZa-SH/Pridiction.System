
name: Build KoaZa WPF app

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KoaZa
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Check project files
        shell: pwsh
        run: |
          $files = @(
            "src/KoaZa/KoaZa.sln",
            "src/KoaZa/KoaZa.csproj",
            "src/KoaZa/packages.config"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Install SQLite package
        shell: pwsh
        run: |
          $root = "src/KoaZa/packages"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          nuget install Stub.System.Data.SQLite.Core.NetFramework `
            -Version 1.0.119 `
            -OutputDirectory $root `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install SQLite NuGet package."
          }

          $package = Get-ChildItem $root -Directory |
            Where-Object {
              $_.Name -like "Stub.System.Data.SQLite.Core.NetFramework*"
            } |
            Select-Object -First 1

          if (-not $package) {
            throw "SQLite package folder was not found under $root"
          }

          Write-Host "SQLite package folder: $($package.FullName)"

          $provider = Get-ChildItem $package.FullName -Recurse `
            -Filter "System.Data.SQLite.dll" |
            Select-Object -First 1

          if (-not $provider) {
            throw "System.Data.SQLite.dll was not found in the package."
          }

          $expected = "src/KoaZa/packages/System.Data.SQLite.Core.1.0.119.0/lib/net46"
          New-Item -ItemType Directory -Force -Path $expected | Out-Null

          Copy-Item $provider.FullName `
            "$expected/System.Data.SQLite.dll" -Force

          Write-Host "Managed SQLite provider copied."

          $native = Get-ChildItem $package.FullName -Recurse `
            -Filter "SQLite.Interop.dll"

          if (-not $native) {
            Write-Host "Package file listing:"
            Get-ChildItem $package.FullName -Recurse |
              Select-Object -ExpandProperty FullName

            throw "SQLite.Interop.dll was not found in the package."
          }

          $x86 = $native |
            Where-Object { $_.FullName -match '[\\/]x86[\\/]' } |
            Select-Object -First 1

          $x64 = $native |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1

          if (-not $x86 -or -not $x64) {
            Write-Host "Native DLL locations:"
            $native | ForEach-Object { Write-Host $_.FullName }
            throw "Could not identify both x86 and x64 SQLite native DLLs."
          }

          Write-Host "x86 DLL: $($x86.FullName)"
          Write-Host "x64 DLL: $($x64.FullName)"

      - name: Restore solution
        shell: pwsh
        run: |
          nuget restore "src/KoaZa/KoaZa.sln" -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet solution restore failed."
          }

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "src/KoaZa/KoaZa.sln" `
            /m `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed."
          }

      - name: Build and run Poisson smoke tests
        shell: pwsh
        run: |
          msbuild "tests/PoissonModel.SmokeTests/PoissonModel.SmokeTests.csproj" /p:Configuration=Release /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Poisson smoke-test project build failed."
          }

          & "tests/PoissonModel.SmokeTests/bin/Release/PoissonModel.SmokeTests.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Poisson model smoke tests failed."
          }

      - name: Copy SQLite native DLLs
        shell: pwsh
        run: |
          $root = "src/KoaZa/packages"
          $output = "src/KoaZa/bin/Release"

          $package = Get-ChildItem $root -Directory |
            Where-Object {
              $_.Name -like "Stub.System.Data.SQLite.Core.NetFramework*"
            } |
            Select-Object -First 1

          if (-not $package) {
            throw "SQLite package folder was not found."
          }

          $native = Get-ChildItem $package.FullName -Recurse `
            -Filter "SQLite.Interop.dll"

          $x86 = $native |
            Where-Object { $_.FullName -match '[\\/]x86[\\/]' } |
            Select-Object -First 1

          $x64 = $native |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1

          if (-not $x86 -or -not $x64) {
            throw "Required SQLite native DLLs are missing."
          }

          New-Item -ItemType Directory -Force `
            -Path "$output/x86" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "$output/x64" | Out-Null

          Copy-Item $x86.FullName `
            "$output/x86/SQLite.Interop.dll" -Force

          Copy-Item $x64.FullName `
            "$output/x64/SQLite.Interop.dll" -Force

          Write-Host "SQLite native files copied to Release output."

      - name: Prepare portable output
        shell: pwsh
        run: |
          $source = "src/KoaZa/bin/Release"
          $target = "artifact/KoaZa"

          if (-not (Test-Path "$source/KoaZa.exe")) {
            throw "KoaZa.exe was not produced."
          }

          if (-not (Test-Path "$source/System.Data.SQLite.dll")) {
            throw "System.Data.SQLite.dll is missing from Release output."
          }

          if (-not (Test-Path "$source/x86/SQLite.Interop.dll")) {
            throw "x86 SQLite.Interop.dll is missing."
          }

          if (-not (Test-Path "$source/x64/SQLite.Interop.dll")) {
            throw "x64 SQLite.Interop.dll is missing."
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force

          if (Test-Path "README_FA.md") {
            Copy-Item "README_FA.md" $target -Force
          }

          Write-Host "Portable output prepared successfully."
          Get-ChildItem $target -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Windows-Build
          path: artifact/KoaZa/
          if-no-files-found: error
          retention-days: 7
