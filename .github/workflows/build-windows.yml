
name: Build KoaZa WPF app

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      - name: Restore NuGet packages
        run: nuget restore src/KoaZa/KoaZa.sln -PackagesDirectory src/KoaZa/packages -NonInteractive -Verbosity detailed

      - name: Verify SQLite package
        shell: pwsh
        run: |
          $dll = "src\KoaZa\packages\System.Data.SQLite.Core.1.0.119.0\lib\net46\System.Data.SQLite.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "SQLite DLL is missing after NuGet restore."
            exit 1
          }

      - name: Build Release
        run: msbuild src/KoaZa/KoaZa.sln /m /p:Configuration=Release "/p:Platform=Any CPU" /verbosity:minimal

      - name: Prepare portable output folder
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}\artifact\KoaZa"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src\KoaZa\bin\Release\*" $out -Recurse -Force
          Copy-Item "README_FA.md" $out -Force
          if (-not (Test-Path "$out\KoaZa.exe")) {
            throw "KoaZa.exe was not produced by the build."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Windows-Build
          path: artifact/KoaZa
          if-no-files-found: error
