
name: Build KoaZa WPF app

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build KoaZa
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "src/KoaZa/KoaZa.sln" `
            -PackagesDirectory "src/KoaZa/packages" `
            -NonInteractive `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }

      - name: Extract SQLite package if needed
        shell: pwsh
        run: |
          $root = "src/KoaZa/packages"
          $expected = Join-Path $root "System.Data.SQLite.Core.1.0.119.0/lib/net46/System.Data.SQLite.dll"

          if (-not (Test-Path $expected)) {
            $nupkg = Get-ChildItem $root -Recurse -Filter "System.Data.SQLite.Core.1.0.119.0.nupkg" |
              Select-Object -First 1

            if ($nupkg) {
              $zip = Join-Path $env:RUNNER_TEMP "sqlite-package.zip"
              $temp = Join-Path $env:RUNNER_TEMP "sqlite-package"

              Copy-Item $nupkg.FullName $zip -Force
              Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive -LiteralPath $zip -DestinationPath $temp -Force

              $dll = Get-ChildItem $temp -Recurse -Filter "System.Data.SQLite.dll" |
                Select-Object -First 1

              if ($dll) {
                New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
                Copy-Item $dll.FullName $expected -Force
              }
            }
          }

          if (-not (Test-Path $expected)) {
            Write-Host "SQLite package files:"
            Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "System.Data.SQLite.dll is still missing. Check the NuGet package contents and restore log."
          }

          Write-Host "SQLite DLL found: $expected"

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "src/KoaZa/KoaZa.sln" `
            /m `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed."
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          $source = "src/KoaZa/bin/Release"
          $target = "artifact/KoaZa"

          if (-not (Test-Path "$source/KoaZa.exe")) {
            throw "KoaZa.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force

          if (Test-Path "README_FA.md") {
            Copy-Item "README_FA.md" $target -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Windows-Build
          path: artifact/KoaZa/
          if-no-files-found: error
          retention-days: 7
